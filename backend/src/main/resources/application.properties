spring.application.name=springbootdemo

server.servlet.context-path=/

sever.port=8080
spring.mvc.hiddenmethod.filter.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB
## connection info
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=jdbc:sqlserver://127.0.0.1:1433;databaseName=Project;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}

## jpa config
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=1800
server.servlet.session.cookie.name=jjkk1111
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.max-age=1800
server.servlet.session.cookie.same-site=lax
# LINE Pay 憑證
linepay.channel.id=${LINEPAY_CHANNEL_ID}
linepay.channel.secret=${LINEPAY_CHANNEL_SECRET}
# 測試環境 URL
linepay.api.url=https://sandbox-api-pay.line.me/v3/payments/request
# 付款成功後，LINE Pay 要把用戶導回 Vue 的哪一個頁面
linepay.redirect.confirm=http://localhost:5173/payment/confirm
linepay.redirect.cancel=http://localhost:5173/payment/cancel

# 💡 將剛才拿到的值填入下方 [cite: 2026-01-14]
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile, email

# Cloudinary 設定
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ===============================
# Mail 設定 (Gmail)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# 1. 填入你剛才登入的那個 Gmail 信箱
spring.mail.username=${MAIL_USERNAME}

# 2. 填入你剛才拿到的 16 位數密碼 (記得不要有空格)
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT 簽章密鑰：由環境變數提供，不寫在程式碼裡（至少 32 個字元）
jwt.secret=${JWT_SECRET}
